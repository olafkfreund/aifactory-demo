<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic Tac Toe</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1rem;
        margin: 2rem;
      }
      h1 {
        margin: 0;
      }
      .controls {
        display: flex;
        align-items: center;
        gap: 1rem;
      }
      .status {
        font-size: 1.25rem;
        min-height: 1.5rem;
      }
      .board {
        display: grid;
        grid-template-columns: repeat(3, 5rem);
        grid-template-rows: repeat(3, 5rem);
        gap: 4px;
      }
      .cell {
        font-size: 2.5rem;
        font-weight: bold;
        background: #f0f0f0;
        border: 1px solid #ccc;
        cursor: pointer;
      }
      .cell:disabled {
        cursor: default;
      }
      button {
        font-size: 1rem;
      }
    </style>
  </head>
  <body>
    <h1>Tic Tac Toe</h1>

    <div class="controls">
      <label>
        <input type="checkbox" data-vs-computer />
        Play vs computer
      </label>
      <button type="button" data-reset>Reset</button>
    </div>

    <p class="status" data-status></p>

    <div class="board">
      <button type="button" class="cell" data-cell></button>
      <button type="button" class="cell" data-cell></button>
      <button type="button" class="cell" data-cell></button>
      <button type="button" class="cell" data-cell></button>
      <button type="button" class="cell" data-cell></button>
      <button type="button" class="cell" data-cell></button>
      <button type="button" class="cell" data-cell></button>
      <button type="button" class="cell" data-cell></button>
      <button type="button" class="cell" data-cell></button>
    </div>

    <script type="module" src="./src/ui.js"></script>
  </body>
</html>

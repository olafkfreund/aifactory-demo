[project]
name = "aifactory-demo"
version = "0.1.0"
description = "FastAPI demo service — inventory reservation and link shortener."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
  "httpx>=0.27",
  "pytest-cov>=5",
]
dev = [
  "ruff>=0.4",
  "pip-audit",
  "bandit>=1.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["scripts/", "docs/"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "e2e: end-to-end tests that require a running server",
]

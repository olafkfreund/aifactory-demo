<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tic-Tac-Toe</title>
<style>
  :root {
    color-scheme: light dark;
    --line: #888;
    --win: #2e7d32;
    --win-bg: #c8e6c9;
  }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1rem;
    padding: 2rem 1rem;
  }
  h1 {
    margin: 0;
  }
  #status {
    font-size: 1.25rem;
    min-height: 1.5em;
  }
  #board {
    display: flex;
    flex-direction: column;
    gap: 4px;
    background: var(--line);
    border: 4px solid var(--line);
  }
  .row {
    display: flex;
    gap: 4px;
  }
  .cell {
    width: 90px;
    height: 90px;
    background: Canvas;
    color: CanvasText;
    font-size: 2.5rem;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    border: none;
    padding: 0;
  }
  .cell[aria-disabled="true"] {
    cursor: default;
  }
  .cell:focus-visible {
    outline: 3px solid Highlight;
    outline-offset: -3px;
  }
  .cell.win {
    background: var(--win-bg);
    color: var(--win);
  }
  #new-game {
    font-size: 1rem;
    padding: 0.5rem 1.25rem;
    cursor: pointer;
  }
</style>
</head>
<body>
  <h1>Tic-Tac-Toe</h1>
  <div id="status" role="status" aria-live="polite"></div>
  <div id="board" role="grid" aria-label="Tic-tac-toe board"></div>
  <button id="new-game" type="button">New game</button>

  <script src="game.js"></script>
  <script>
    (function () {
      var boardEl = document.getElementById("board");
      var statusEl = document.getElementById("status");
      var newGameBtn = document.getElementById("new-game");

      var state = TicTacToe.createGame();
      var cellButtons = [];
      var focusedIndex = 0;

      function positionLabel(index) {
        var row = Math.floor(index / 3) + 1;
        var col = (index % 3) + 1;
        return "row " + row + ", column " + col;
      }

      function setFocusedIndex(index) {
        focusedIndex = index;
        for (var i = 0; i < 9; i++) {
          cellButtons[i].tabIndex = i === index ? 0 : -1;
        }
      }

      function render() {
        var winningLine = state.winningLine || [];
        var gameOver = state.winner !== null || state.isDraw;
        for (var i = 0; i < 9; i++) {
          var btn = cellButtons[i];
          var mark = state.board[i];
          btn.textContent = mark || "";
          btn.setAttribute("aria-disabled", mark !== null || gameOver ? "true" : "false");
          btn.setAttribute("aria-label", positionLabel(i) + ", " + (mark || "empty"));
          btn.classList.toggle("win", winningLine.indexOf(i) !== -1);
        }

        if (state.winner) {
          statusEl.textContent = state.winner + " wins!";
        } else if (state.isDraw) {
          statusEl.textContent = "Draw!";
        } else {
          statusEl.textContent = state.currentPlayer + "'s turn";
        }
      }

      function handleCellClick(index) {
        state = TicTacToe.makeMove(state, index);
        render();
      }

      for (var row = 0; row < 3; row++) {
        var rowEl = document.createElement("div");
        rowEl.className = "row";
        rowEl.setAttribute("role", "row");
        boardEl.appendChild(rowEl);

        for (var col = 0; col < 3; col++) {
          (function (index) {
            var btn = document.createElement("button");
            btn.type = "button";
            btn.className = "cell";
            btn.setAttribute("role", "gridcell");
            btn.tabIndex = index === 0 ? 0 : -1;
            btn.addEventListener("click", function () {
              setFocusedIndex(index);
              handleCellClick(index);
            });
            rowEl.appendChild(btn);
            cellButtons.push(btn);
          })(row * 3 + col);
        }
      }

      boardEl.addEventListener("keydown", function (event) {
        var currentIndex = cellButtons.indexOf(document.activeElement);
        if (currentIndex === -1) return;

        var nextIndex = TicTacToe.nextFocusIndex(currentIndex, event.key);
        if (nextIndex !== currentIndex) {
          event.preventDefault();
          setFocusedIndex(nextIndex);
          cellButtons[nextIndex].focus();
        }
      });

      newGameBtn.addEventListener("click", function () {
        state = TicTacToe.createGame();
        setFocusedIndex(0);
        render();
      });

      render();
    })();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f0f0;
            padding: 20px;
        }

        main {
            background: white;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        h1 {
            margin-bottom: 20px;
            color: #333;
            font-size: 2rem;
        }

        .status-area {
            margin-bottom: 30px;
            min-height: 3rem;
        }

        .current-player {
            font-size: 1.25rem;
            font-weight: 600;
            color: #555;
            margin-bottom: 10px;
        }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            gap: 5px;
            margin-bottom: 30px;
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
            background-color: #ddd;
            padding: 5px;
            border-radius: 4px;
        }

        .cell {
            width: 100px;
            height: 100px;
            background-color: white;
            border: none;
            font-size: 2rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            transition: background-color 0.2s;
            color: #333;
        }

        .cell:hover {
            background-color: #f9f9f9;
        }

        /* Ensure focus is always visible */
        .cell:focus {
            outline: none;
            box-shadow: inset 0 0 0 3px #4A90E2;
            background-color: #e8f0ff;
        }

        .cell:focus:not(:focus-visible) {
            box-shadow: inset 0 0 0 3px #4A90E2;
        }

        .cell:focus-visible {
            outline: 3px solid #4A90E2;
            outline-offset: 2px;
            box-shadow: inset 0 0 0 3px #4A90E2;
        }

        .buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
        }

        button.reset-btn {
            padding: 10px 20px;
            font-size: 1rem;
            background-color: #4A90E2;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            transition: background-color 0.2s;
        }

        button.reset-btn:hover {
            background-color: #357abd;
        }

        button.reset-btn:focus {
            outline: 3px solid #4A90E2;
            outline-offset: 2px;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border-width: 0;
        }

        .live-region {
            margin-top: 20px;
            font-size: 1.1rem;
            font-weight: 600;
            min-height: 2rem;
            color: #2e7d32;
        }

        .result-message {
            background-color: #e8f5e9;
            padding: 15px;
            border-radius: 4px;
            border-left: 4px solid #4caf50;
        }
    </style>
</head>
<body>
    <main>
        <h1>Tic-Tac-Toe</h1>

        <section class="status-area">
            <div class="current-player" aria-live="polite" aria-atomic="true" id="status">
                Current player: X
            </div>
        </section>

        <section aria-label="Game board" class="game-grid" role="application" id="game-grid">
            <!-- Cells will be generated by JavaScript -->
        </section>

        <div aria-live="polite" aria-atomic="true" aria-label="Game announcements" id="announcements" class="sr-only"></div>

        <div class="live-region" aria-live="assertive" aria-atomic="true" id="live-region"></div>

        <div class="buttons">
            <button class="reset-btn" id="reset-btn" type="button">New Game</button>
        </div>
    </main>

    <script>
        // Game state
        let board = ['', '', '', '', '', '', '', '', ''];
        let currentPlayer = 'X';
        let gameActive = true;
        let focusedCell = 0;

        const WINNING_CONDITIONS = [
            [0, 1, 2],
            [3, 4, 5],
            [6, 7, 8],
            [0, 3, 6],
            [1, 4, 7],
            [2, 5, 8],
            [0, 4, 8],
            [2, 4, 6]
        ];

        // Initialize the game
        function initGame() {
            const gameGrid = document.getElementById('game-grid');
            gameGrid.innerHTML = '';

            for (let i = 0; i < 9; i++) {
                const button = document.createElement('button');
                button.type = 'button';
                button.className = 'cell';
                button.id = `cell-${i}`;
                button.setAttribute('data-index', i);
                button.setAttribute('aria-label', `Cell ${Math.floor(i / 3) + 1} ${(i % 3) + 1}`);

                button.addEventListener('click', handleCellClick);
                button.addEventListener('keydown', handleCellKeydown);
                button.addEventListener('focus', handleCellFocus);

                gameGrid.appendChild(button);
            }

            // Focus first cell
            document.getElementById('cell-0').focus();
            focusedCell = 0;
            updateBoard();
        }

        function getRowCol(index) {
            return { row: Math.floor(index / 3) + 1, col: (index % 3) + 1 };
        }

        function updateCellLabel(index) {
            const cell = document.getElementById(`cell-${index}`);
            const { row, col } = getRowCol(index);
            const mark = board[index] || '';
            if (mark) {
                cell.setAttribute('aria-label', `Cell ${row} ${col}, ${mark}`);
            } else {
                cell.setAttribute('aria-label', `Cell ${row} ${col}`);
            }
        }

        function handleCellClick(e) {
            const index = parseInt(e.target.getAttribute('data-index'));
            makeMove(index);
        }

        function handleCellKeydown(e) {
            const index = parseInt(e.target.getAttribute('data-index'));

            switch(e.key) {
                case 'ArrowUp':
                    e.preventDefault();
                    moveFocus(index - 3);
                    break;
                case 'ArrowDown':
                    e.preventDefault();
                    moveFocus(index + 3);
                    break;
                case 'ArrowLeft':
                    e.preventDefault();
                    moveFocus(index - 1);
                    break;
                case 'ArrowRight':
                    e.preventDefault();
                    moveFocus(index + 1);
                    break;
                case 'Enter':
                case ' ':
                    e.preventDefault();
                    makeMove(index);
                    break;
            }
        }

        function handleCellFocus(e) {
            focusedCell = parseInt(e.target.getAttribute('data-index'));
        }

        function moveFocus(targetIndex) {
            if (targetIndex >= 0 && targetIndex < 9) {
                document.getElementById(`cell-${targetIndex}`).focus();
            }
        }

        function makeMove(index) {
            if (!gameActive || board[index] !== '') {
                announce(`Cell ${getRowCol(index).row} ${getRowCol(index).col} is already occupied.`);
                return;
            }

            board[index] = currentPlayer;
            updateCellLabel(index);
            updateBoard();

            const result = checkResult();
            if (result.gameEnd) {
                gameActive = false;
                if (result.winner) {
                    const message = `Game over! Player ${result.winner} wins!`;
                    document.getElementById('live-region').innerHTML = `<div class="result-message">${message}</div>`;
                    announce(message);
                } else {
                    const message = "Game over! It's a draw!";
                    document.getElementById('live-region').innerHTML = `<div class="result-message">${message}</div>`;
                    announce(message);
                }
            } else {
                switchPlayer();
            }
        }

        function switchPlayer() {
            currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
            updateBoard();
            const message = `Turn changed. Current player: ${currentPlayer}`;
            announce(message);
        }

        function updateBoard() {
            for (let i = 0; i < 9; i++) {
                const cell = document.getElementById(`cell-${i}`);
                cell.textContent = board[i];
                updateCellLabel(i);
            }

            document.getElementById('status').textContent = gameActive
                ? `Current player: ${currentPlayer}`
                : 'Game Over';
        }

        function checkResult() {
            for (let condition of WINNING_CONDITIONS) {
                const [a, b, c] = condition;
                if (board[a] && board[a] === board[b] && board[a] === board[c]) {
                    return { gameEnd: true, winner: board[a] };
                }
            }

            if (board.every(cell => cell !== '')) {
                return { gameEnd: true, winner: null };
            }

            return { gameEnd: false, winner: null };
        }

        function resetGame() {
            board = ['', '', '', '', '', '', '', '', ''];
            currentPlayer = 'X';
            gameActive = true;
            focusedCell = 0;
            document.getElementById('live-region').innerHTML = '';
            document.getElementById('announcements').textContent = '';
            initGame();
            announce('New game started. Current player: X');
        }

        function announce(message) {
            const announcer = document.getElementById('announcements');
            announcer.textContent = message;
        }

        // Setup reset button
        document.getElementById('reset-btn').addEventListener('click', resetGame);
        document.getElementById('reset-btn').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                resetGame();
            }
        });

        // Start the game
        initGame();
        announce('Tic-Tac-Toe game loaded. Use arrow keys to navigate the grid, Enter or Space to select a cell. Current player: X');
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tic-Tac-Toe</title>
<style>
  :root {
    color-scheme: light dark;
    --line: #888;
    --win: #2e7d32;
    --win-bg: #c8e6c9;
  }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1rem;
    margin: 2rem 1rem;
  }
  h1 {
    margin: 0;
  }
  #status {
    font-size: 1.25rem;
    min-height: 1.6em;
  }
  #board {
    display: grid;
    grid-template-columns: repeat(3, 6rem);
    grid-template-rows: repeat(3, 6rem);
    gap: 4px;
    background: var(--line);
    border: 4px solid var(--line);
  }
  .cell {
    background: Canvas;
    color: CanvasText;
    font-size: 3rem;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    border: none;
    padding: 0;
  }
  .cell:disabled {
    cursor: default;
  }
  .cell.win {
    background: var(--win-bg);
    color: var(--win);
  }
  #new-game {
    font-size: 1rem;
    padding: 0.5rem 1.25rem;
    cursor: pointer;
  }
</style>
</head>
<body>
  <h1>Tic-Tac-Toe</h1>
  <div id="status" role="status" aria-live="polite"></div>
  <div id="board"></div>
  <button id="new-game" type="button">New game</button>

  <script src="game.js"></script>
  <script>
    (function () {
      "use strict";
      var boardEl = document.getElementById("board");
      var statusEl = document.getElementById("status");
      var newGameBtn = document.getElementById("new-game");

      var state = TicTacToe.createGame();
      var cells = [];

      for (var i = 0; i < 9; i++) {
        var cell = document.createElement("button");
        cell.type = "button";
        cell.className = "cell";
        cell.setAttribute("aria-label", "Cell " + (i + 1));
        cell.addEventListener("click", (function (index) {
          return function () {
            state = TicTacToe.move(state, index);
            render();
          };
        })(i));
        boardEl.appendChild(cell);
        cells.push(cell);
      }

      newGameBtn.addEventListener("click", function () {
        state = TicTacToe.createGame();
        render();
      });

      function render() {
        for (var i = 0; i < 9; i++) {
          var mark = state.board[i];
          cells[i].textContent = mark || "";
          cells[i].disabled = mark !== null || state.over;
          var onWinLine = state.line && state.line.indexOf(i) !== -1;
          cells[i].classList.toggle("win", !!onWinLine);
        }

        if (state.winner) {
          statusEl.textContent = state.winner + " wins!";
        } else if (state.draw) {
          statusEl.textContent = "Draw!";
        } else {
          statusEl.textContent = state.current + "'s turn";
        }
      }

      render();
    })();
  </script>
</body>
</html>

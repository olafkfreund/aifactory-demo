<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }

        h1 {
            color: #333;
        }

        #status {
            font-size: 20px;
            margin-bottom: 20px;
            color: #333;
            font-weight: bold;
            min-height: 30px;
        }

        #board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-gap: 5px;
            background-color: #333;
            padding: 5px;
            margin-bottom: 20px;
            border: 2px solid #333;
        }

        .cell {
            width: 100px;
            height: 100px;
            background-color: white;
            border: none;
            font-size: 32px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            color: #333;
        }

        .cell:hover:not(:disabled) {
            background-color: #f9f9f9;
        }

        .cell:disabled {
            cursor: not-allowed;
        }

        .cell.winner {
            background-color: #4CAF50;
            color: white;
        }

        #newGameBtn {
            padding: 10px 30px;
            font-size: 16px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        #newGameBtn:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <h1>Tic Tac Toe</h1>
    <div id="status">X to move</div>
    <div id="board"></div>
    <button id="newGameBtn">New Game</button>

    <script src="game.js"></script>
    <script>
        // UI Controller
        let gameState = GameLogic.createGame();

        function renderBoard() {
            const board = document.getElementById('board');
            board.innerHTML = '';
            gameState.board.forEach((cell, index) => {
                const button = document.createElement('button');
                button.className = 'cell';
                button.textContent = cell || '';
                if (gameState.winningLine && gameState.winningLine.includes(index)) {
                    button.classList.add('winner');
                }
                button.addEventListener('click', () => handleCellClick(index));
                board.appendChild(button);
            });
        }

        function updateStatus() {
            const status = document.getElementById('status');
            if (gameState.gameOver) {
                if (gameState.winner) {
                    status.textContent = `${gameState.winner} wins!`;
                } else {
                    status.textContent = 'Draw!';
                }
            } else {
                status.textContent = `${gameState.currentPlayer} to move`;
            }
        }

        function handleCellClick(index) {
            if (GameLogic.makeMove(gameState, index)) {
                const result = GameLogic.updateGameState(gameState);
                renderBoard();
                updateStatus();
            }
        }

        function resetGame() {
            gameState = GameLogic.createGame();
            renderBoard();
            updateStatus();
        }

        document.getElementById('newGameBtn').addEventListener('click', resetGame);

        // Initial render
        renderBoard();
        updateStatus();
    </script>
</body>
</html>

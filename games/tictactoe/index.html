<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tic-Tac-Toe</title>
<style>
  :root {
    color-scheme: light dark;
    --gap: 8px;
    --cell: 100px;
  }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    padding: 32px 16px;
    margin: 0;
  }
  h1 {
    margin: 0;
    font-size: 1.5rem;
  }
  #status {
    font-size: 1.1rem;
    min-height: 1.5em;
  }
  #board {
    display: flex;
    flex-direction: column;
    gap: var(--gap);
  }
  .row {
    display: flex;
    gap: var(--gap);
  }
  .cell {
    width: var(--cell);
    height: var(--cell);
    font-size: 2.5rem;
    font-weight: 600;
    line-height: 1;
    background: #f0f0f0;
    border: 2px solid #ccc;
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #222;
  }
  .cell.win {
    background: #a8e6a1;
    border-color: #4caf50;
  }
  .cell:focus-visible {
    outline: 3px solid #1a73e8;
    outline-offset: 2px;
  }
  #new-game {
    font-size: 1rem;
    padding: 8px 20px;
    cursor: pointer;
    border-radius: 6px;
    border: 1px solid #888;
    background: #fff;
  }
</style>
</head>
<body>
  <h1>Tic-Tac-Toe</h1>
  <div id="status" role="status" aria-live="polite"></div>
  <div id="board" role="grid" aria-label="Tic-Tac-Toe board"></div>
  <button id="new-game" type="button">New game</button>

  <script src="game.js"></script>
  <script>
    (function () {
      var boardEl = document.getElementById("board");
      var statusEl = document.getElementById("status");
      var newGameBtn = document.getElementById("new-game");

      var board = TicTacToe.emptyBoard();
      var currentPlayer = "X";
      var cellButtons = [];

      for (var r = 0; r < 3; r++) {
        var rowEl = document.createElement("div");
        rowEl.className = "row";
        rowEl.setAttribute("role", "row");
        for (var c = 0; c < 3; c++) {
          var index = r * 3 + c;
          var btn = document.createElement("button");
          btn.className = "cell";
          btn.type = "button";
          btn.setAttribute("role", "gridcell");
          (function (i) {
            btn.addEventListener("click", function () {
              var next = TicTacToe.move(board, i, currentPlayer);
              if (next === board) return; // occupied cell or game over: no-op
              board = next;
              currentPlayer = currentPlayer === "X" ? "O" : "X";
              render();
            });
          })(index);
          rowEl.appendChild(btn);
          cellButtons.push(btn);
        }
        boardEl.appendChild(rowEl);
      }

      newGameBtn.addEventListener("click", function () {
        board = TicTacToe.emptyBoard();
        currentPlayer = "X";
        render();
      });

      function render() {
        var win = TicTacToe.winner(board);
        var line = TicTacToe.winningLine(board);
        for (var i = 0; i < 9; i++) {
          var btn = cellButtons[i];
          var mark = board[i];
          btn.textContent = mark || "";
          btn.setAttribute(
            "aria-label",
            "row " + (Math.floor(i / 3) + 1) +
              ", column " + ((i % 3) + 1) +
              ", " + (mark || "empty")
          );
          btn.classList.toggle("win", !!(line && line.indexOf(i) !== -1));
        }

        if (win === "X" || win === "O") {
          statusEl.textContent = win + " wins!";
        } else if (win === "draw") {
          statusEl.textContent = "Draw!";
        } else {
          statusEl.textContent = currentPlayer + "'s turn";
        }
      }

      render();
    })();
  </script>
</body>
</html>

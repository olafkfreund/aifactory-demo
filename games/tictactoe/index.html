<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accessible Tic Tac Toe</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <div class="container">
      <h1>Tic Tac Toe</h1>

      <!-- Accessibility: live region for announcements -->
      <div role="status" aria-live="polite" aria-atomic="true" class="sr-only" id="gameStatus">
        Game started. X's turn.
      </div>

      <!-- Game board -->
      <div role="application" aria-label="Tic Tac Toe Game Board">
        <div class="board" id="board" role="grid">
          <!-- Cells will be generated by JavaScript -->
        </div>
      </div>

      <!-- Game info -->
      <div class="info">
        <p id="turnDisplay">X's Turn</p>
        <p id="resultDisplay"></p>
      </div>

      <!-- Reset button -->
      <button id="resetBtn" class="reset-button">New Game</button>
    </div>
  </main>

  <script src="game.js"></script>
</body>
</html>

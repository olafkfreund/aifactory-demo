<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tic-Tac-Toe</title>
<style>
  :root {
    color-scheme: light dark;
    --line: #888;
    --win: #2e7d32;
    --win-bg: #c8e6c9;
  }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1rem;
    padding: 2rem 1rem;
  }
  h1 {
    margin: 0;
  }
  #status {
    font-size: 1.25rem;
    min-height: 1.5em;
  }
  #board {
    display: grid;
    grid-template-columns: repeat(3, 90px);
    grid-template-rows: repeat(3, 90px);
    gap: 4px;
    background: var(--line);
    border: 4px solid var(--line);
  }
  .cell {
    background: Canvas;
    color: CanvasText;
    font-size: 2.5rem;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    border: none;
    padding: 0;
  }
  .cell:disabled {
    cursor: default;
  }
  .cell.win {
    background: var(--win-bg);
    color: var(--win);
  }
  #new-game {
    font-size: 1rem;
    padding: 0.5rem 1.25rem;
    cursor: pointer;
  }
  #controls {
    font-size: 1rem;
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }
</style>
</head>
<body>
  <h1>Tic-Tac-Toe</h1>
  <label id="controls" for="vs-computer">
    <input type="checkbox" id="vs-computer" />
    Play vs Computer (O)
  </label>
  <div id="status" role="status" aria-live="polite"></div>
  <div id="board"></div>
  <button id="new-game" type="button">New game</button>

  <script src="game.js"></script>
  <script>
    (function () {
      var boardEl = document.getElementById("board");
      var statusEl = document.getElementById("status");
      var newGameBtn = document.getElementById("new-game");
      var vsComputerCheckbox = document.getElementById("vs-computer");

      var state = TicTacToe.createGame();
      var cellButtons = [];

      function render() {
        var winningLine = state.winningLine || [];
        for (var i = 0; i < 9; i++) {
          var btn = cellButtons[i];
          var mark = state.board[i];
          btn.textContent = mark || "";
          btn.disabled = mark !== null || state.winner !== null || state.isDraw;
          btn.classList.toggle("win", winningLine.indexOf(i) !== -1);
        }

        if (state.winner) {
          statusEl.textContent = state.winner + " wins!";
        } else if (state.isDraw) {
          statusEl.textContent = "Draw!";
        } else {
          statusEl.textContent = state.currentPlayer + "'s turn";
        }
      }

      // When "Play vs Computer" is on and it's O's turn, let the AI move.
      // No-ops (and leaves two-player mode untouched) when the toggle is off.
      function maybeComputerMove() {
        if (!vsComputerCheckbox.checked) return;
        if (state.winner !== null || state.isDraw) return;
        if (state.currentPlayer !== "O") return;

        var move = TicTacToe.bestMove(state);
        state = TicTacToe.makeMove(state, move);
        render();
      }

      function handleCellClick(index) {
        state = TicTacToe.makeMove(state, index);
        render();
        maybeComputerMove();
      }

      for (var i = 0; i < 9; i++) {
        (function (index) {
          var btn = document.createElement("button");
          btn.type = "button";
          btn.className = "cell";
          btn.setAttribute("aria-label", "Cell " + (index + 1));
          btn.addEventListener("click", function () {
            handleCellClick(index);
          });
          boardEl.appendChild(btn);
          cellButtons.push(btn);
        })(i);
      }

      newGameBtn.addEventListener("click", function () {
        state = TicTacToe.createGame();
        render();
      });

      vsComputerCheckbox.addEventListener("change", function () {
        maybeComputerMove();
      });

      render();
    })();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tic-Tac-Toe</title>
<style>
  :root {
    color-scheme: light dark;
    --gap: 8px;
    --cell: 100px;
  }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    padding: 32px 16px;
    margin: 0;
  }
  main {
    display: contents;
  }
  h1 {
    margin: 0;
    font-size: 1.5rem;
  }
  #status {
    font-size: 1.1rem;
    min-height: 1.5em;
  }
  #board {
    display: flex;
    flex-direction: column;
    gap: var(--gap);
  }
  .row {
    display: flex;
    gap: var(--gap);
  }
  .cell {
    width: var(--cell);
    height: var(--cell);
    font-size: 2.5rem;
    font-weight: 600;
    line-height: 1;
    background: #f0f0f0;
    border: 2px solid #ccc;
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #222;
  }
  .cell.win {
    background: #a8e6a1;
    border-color: #4caf50;
  }
  .cell:focus-visible {
    outline: 3px solid #1a73e8;
    outline-offset: 2px;
  }
  #new-game {
    font-size: 1rem;
    padding: 8px 20px;
    cursor: pointer;
    border-radius: 6px;
    border: 1px solid #888;
    background: #fff;
  }
  #vs-computer-label {
    font-size: 1rem;
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
  }
</style>
</head>
<body>
  <main>
    <h1>Tic-Tac-Toe</h1>
    <label id="vs-computer-label" for="vs-computer">
      <input type="checkbox" id="vs-computer" />
      Play vs Computer (X vs O, computer plays O)
    </label>
    <div id="status" role="status" aria-live="polite"></div>
    <div id="board" role="grid" aria-label="Tic-Tac-Toe board"></div>
    <button id="new-game" type="button">New game</button>
  </main>

  <script src="game.js"></script>
  <script>
    (function () {
      var boardEl = document.getElementById("board");
      var statusEl = document.getElementById("status");
      var newGameBtn = document.getElementById("new-game");
      var vsComputerCheckbox = document.getElementById("vs-computer");

      // Human always plays X; when vs-computer mode is on, the AI plays O.
      var AI_PLAYER = "O";
      var COMPUTER_MOVE_DELAY_MS = 300; // well under the 1s response budget

      var state = TicTacToe.newGame();
      var cellButtons = [];
      var focusedIndex = 0;
      var vsComputer = false;
      var NAV_KEYS = ["ArrowRight", "ArrowLeft", "ArrowUp", "ArrowDown", "Home", "End"];

      for (var r = 0; r < 3; r++) {
        var rowEl = document.createElement("div");
        rowEl.className = "row";
        rowEl.setAttribute("role", "row");
        for (var c = 0; c < 3; c++) {
          var index = r * 3 + c;
          var btn = document.createElement("button");
          btn.className = "cell";
          btn.type = "button";
          btn.setAttribute("role", "gridcell");
          (function (i) {
            btn.addEventListener("click", function () {
              // While vs-computer mode is on, ignore clicks during the
              // computer's turn so a human click can't play its mark.
              if (vsComputer && state.currentPlayer === AI_PLAYER) return;
              focusedIndex = i;
              state = TicTacToe.applyMove(state, i);
              render();
              maybeMakeComputerMove();
            });
          })(index);
          rowEl.appendChild(btn);
          cellButtons.push(btn);
        }
        boardEl.appendChild(rowEl);
      }

      boardEl.addEventListener("keydown", function (event) {
        if (NAV_KEYS.indexOf(event.key) === -1) return;
        event.preventDefault();
        focusedIndex = TicTacToe.nextFocusIndex(focusedIndex, event.key);
        updateTabIndexes();
        cellButtons[focusedIndex].focus();
      });

      newGameBtn.addEventListener("click", function () {
        state = TicTacToe.newGame();
        focusedIndex = 0;
        render();
      });

      vsComputerCheckbox.addEventListener("change", function () {
        vsComputer = vsComputerCheckbox.checked;
        // Start fresh so the human/computer turn order is unambiguous.
        state = TicTacToe.newGame();
        focusedIndex = 0;
        render();
      });

      function maybeMakeComputerMove() {
        if (!vsComputer) return;
        if (TicTacToe.isGameOver(state)) return;
        if (state.currentPlayer !== AI_PLAYER) return;
        // Snapshot the state this move was scheduled for. If a new game or
        // toggle change replaces `state` before this fires, skip it instead
        // of playing a stale move into an unrelated game.
        var scheduledState = state;
        setTimeout(function () {
          if (state !== scheduledState) return;
          var idx = TicTacToe.bestMove(state.board, state.currentPlayer);
          if (idx !== null) {
            state = TicTacToe.applyMove(state, idx);
            render();
          }
        }, COMPUTER_MOVE_DELAY_MS);
      }

      function updateTabIndexes() {
        for (var i = 0; i < 9; i++) {
          cellButtons[i].tabIndex = i === focusedIndex ? 0 : -1;
        }
      }

      function render() {
        var result = TicTacToe.winner(state.board);
        var line = TicTacToe.winningLine(state.board);

        for (var i = 0; i < 9; i++) {
          var btn = cellButtons[i];
          var mark = state.board[i];
          btn.textContent = mark || "";
          btn.setAttribute(
            "aria-label",
            "row " + (Math.floor(i / 3) + 1) +
              ", column " + ((i % 3) + 1) +
              ", " + (mark || "empty")
          );
          var isWinCell = line && line.indexOf(i) !== -1;
          btn.classList.toggle("win", !!isWinCell);
        }
        updateTabIndexes();

        if (result === "draw") {
          statusEl.textContent = "Draw!";
        } else if (result) {
          statusEl.textContent = result + " wins!";
        } else {
          statusEl.textContent = state.currentPlayer + "'s turn";
        }
      }

      render();
    })();
  </script>
</body>
</html>
